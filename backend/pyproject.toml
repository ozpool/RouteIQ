[project]
name = "routeiq-backend"
version = "1.0.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "django-cors-headers>=4.4,<5",
    "httpx>=0.27,<0.29",
    "pydantic-settings>=2.6,<3",
    "whitenoise>=6.7,<7",
    "gunicorn>=23,<24",
    "redis>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
